name: Archive checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npx --yes npm@12.2.0 ci --ignore-scripts
      - run: npx --yes npm@12.2.0 run check
      - run: npx --yes npm@12.2.0 test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check localized website in three engines
        run: npx --yes npm@12.2.0 run test:web
      - name: Verify the PowerShell entrypoint
        shell: pwsh
        run: ./99_Evidence/GENERATE_SHA256.ps1
      - name: Keep integrity reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-checks-${{ matrix.os }}-${{ github.sha }}
          path: output/checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep web verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-checks-${{ matrix.os }}-${{ github.sha }}
          path: |
            output/web/
            dist/build-record.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Package the checked website
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
